; Godot 导出预设 —— 打包给朋友玩的 Windows 版
;
; 两个预设：
;   「Windows 交付版」  —— 发给别人的成品，不含测试与开发工具，PCK 内嵌进 exe（单文件）
;   「Windows 自检版」  —— 打包自检用：把测试也打进去，导出后能在成品里跑一遍完整测试，
;                          用来验证资源（JSON/图片/音频）真的被装进了 PCK
;
; 关键：include_filter 里的 *.json 不能删！
; data/*.json 是运行时用 FileAccess 裸读的（不是 Godot 资源），
; 不显式包含的话，导出的游戏一启动就会报「JSON 不存在」，整个游戏起不来。

[preset.0]

name="Windows Release"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, tools/*, *.md, .shots/*"
export_path="dist/ElementRift.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

